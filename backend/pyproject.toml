[project]
name = "nedmori-backend"
version = "0.1.0"
description = "Nedmori local API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "sqlmodel>=0.0.25",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
